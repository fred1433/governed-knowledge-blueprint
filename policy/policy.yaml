# Publication policy for a governed knowledge system.
#
# This file is the policy. It is not a description of a policy that lives somewhere else:
# src/policy.mjs loads this file, the reference service in service/ applies it on the server
# before anything is indexed or returned, and the checks in tests/ exercise it over HTTP.
#
# A rule names a predicate implemented in src/policy-core.mjs. A rule whose predicate is not
# implemented is a hard error at load time, so this file can never claim a control that does
# not run. The order matters: the first rule that fires is the reason the item is withheld.

version: 2
policy_name: Approved-knowledge publication policy
drafted: 2026-09-16
status: sample for discussion, not adopted

# Sensitivity ladder. client_private has no reader anywhere in this system: it is not the top
# of a permission ladder, it is outside the ladder.
confidentiality_levels:
  - public
  - internal
  - client_private

# Two roles, named for what they do to knowledge. They are not the analyst directory: that
# directory describes people the knowledge is about, not the people who read it.
roles:
  knowledge_reader:
    label: Knowledge reader
    audiences: [public, all_staff]
    may_approve: false
  senior_reviewer:
    label: Senior reviewer
    audiences: [public, all_staff, leadership]
    may_approve: true

# The metadata a published item must carry. Unknown is not a warning here: an item missing any
# of these is refused publication. A value nobody has set is not a value to be confirmed later,
# it is a missing accountability.
required_metadata:
  - source
  - attribution
  - permission
  - confidentiality
  - owner
  - reviewer
  - review_date

rules:
  - id: R1_PRIVATE_ISOLATION
    predicate: confidentiality_in
    params:
      values: [client_private]
    applies_to: all_roles
    reason: >-
      Private client material is isolated from shared knowledge. No role reads it here, and it is
      never published by any path. When a lesson from an engagement is worth keeping, a person
      writes a separate de-identified item and approves that instead. The original stays where it
      is, before and after.

  - id: R2_REQUIRED_METADATA_UNKNOWN
    predicate: required_metadata_unknown
    params:
      fields: [owner, reviewer, review_date, attribution]
    applies_to: all_roles
    reason: >-
      Publication is refused while owner, reviewer, review date or attribution is unknown. Being
      published on the public website is not the same as being approved shared knowledge: somebody
      still has to be accountable for the item being current and correct.

  - id: R3_APPROVAL_REQUIRED
    predicate: approval_status_not_in
    params:
      values: [approved]
    applies_to: all_roles
    reason: >-
      Only an item a senior reviewer has approved is published. The judgement is human. What the
      code enforces is that the approval exists, that it names who gave it, and that it is attached
      to a version.

  - id: R4_APPROVAL_BOUND_TO_VERSION
    predicate: version_drift
    applies_to: all_roles
    reason: >-
      The approval was given for a specific version of this item. The text has changed since, so the
      approval does not carry over to it. The new version needs its own approval.

  - id: R5_IDENTIFIERS_PRESENT
    predicate: flag_is_true
    params:
      field: contains_client_identifiers
    applies_to: all_roles
    reason: >-
      An item still carrying client identifiers is not published, and approving it does not lift
      this. Whether a de-identification is good enough is a human judgement; what the code does is
      refuse to publish anything still flagged as carrying identifiers.

  - id: R6_WITHDRAWN
    predicate: withdrawn_on_or_before
    applies_to: all_roles
    reason: >-
      The item was withdrawn. It is excluded here from the moment it is withdrawn. Propagation to a
      system outside this one is that system's own timing, and this policy makes no claim about it.

  - id: R7_RETENTION_WINDOW
    predicate: review_date_older_than
    params:
      months: 18
      applies_to_permissions: [internal]
    applies_to: all_roles
    reason: >-
      The review date is outside the retention window, so the item leaves shared knowledge until
      somebody reviews it again. Nobody has to remember: the date is evaluated on every request.

  - id: R8_AUDIENCE_SCOPE
    predicate: audience_not_granted
    applies_to: per_role
    reason: >-
      This item is held for an audience the reader's role does not carry. It is absent from search
      and it is not readable by direct reference either, because hiding an item from a result list
      is not the same as protecting it.

# Exceptions are named, owned and dated. An expired exception stops working on its own, because
# the engine checks the date rather than trusting anyone to remember to remove it.
exceptions:
  - item_id: AN-002
    rule_id: R2_REQUIRED_METADATA_UNKNOWN
    approver: Founder and President
    granted: 2026-09-16
    expires: 2026-09-16
    note: >-
      Sample entry, already expired on the day it was written. It is here to show the shape of an
      exception and to show that an expired one has no effect: AN-002 is still withheld today.

# What this policy does not do, written down so nobody assumes it does.
out_of_scope:
  - It governs what is published into shared knowledge. It does not govern what a person can open inside the source systems themselves.
  - It does not control what a connected assistant does with content a member can already open in the underlying application.
  - Approval is a human act. The registry records it, binds it to a version and refuses to publish without it. It cannot perform it.
  - The quality of a de-identification is a human judgement. The code checks for the strings it was given, which is a floor, not a guarantee.
