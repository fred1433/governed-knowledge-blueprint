name: boundary checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: the checks, over HTTP against the reference service
        run: npm test

      - name: the negative control, each guard removed in turn
        run: npm run negative-control

      - name: the policy digest matches the policy file
        run: |
          recorded=$(cut -d' ' -f1 policy/policy.sha256)
          actual=$(shasum -a 256 policy/policy.yaml | cut -d' ' -f1)
          echo "recorded $recorded"
          echo "actual   $actual"
          test "$recorded" = "$actual"

      - name: the receipt, produced by this run
        run: npm run boundary

      - name: the receipt says PASS
        run: grep -q "^RESULT  PASS" logs/access-boundary-check.log

      - name: no invented identifier ever reaches the real content file
        run: |
          for s in "Northwind" "Priya Raman" "Halden" "Corveil" "private-accounts"; do
            if grep -qi "$s" data/library-sample.json; then
              echo "an invented string reached the real content file: $s"; exit 1
            fi
          done
          echo "the real content file is clean"

      - name: the Library sample is still a sample
        run: |
          n=$(node -e "console.log(require('./data/library-sample.json').items.length)")
          echo "library rows: $n"
          test "$n" -eq 8
